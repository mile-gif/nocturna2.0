<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nocturna - Controle de Estoque</title>
    <!-- Importando a biblioteca oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Estilo Gótico / Dark */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Roboto:wght@300;400&display=swap');

        :root {
            --bg-color: #050505;
            --panel-bg: #111111;
            --border-color: #3a0000;
            --accent-color: #8b0000;
            --accent-hover: #b30000;
            --text-main: #e0e0e0;
            --text-muted: #888888;
            --alert-color: #ff3333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 20px;
        }

        h1, h2, h3 {
            font-family: 'Cinzel', serif;
            color: var(--accent-color);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(139, 0, 0, 0.1);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.9em;
            margin-bottom: 5px;
            color: var(--text-muted);
        }

        input, select {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 2px;
            font-family: 'Roboto', sans-serif;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 5px rgba(139, 0, 0, 0.5);
        }

        .btn-group {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        button {
            background-color: var(--bg-color);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 10px 20px;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
        }

        .controls input {
            flex-grow: 1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            font-family: 'Cinzel', serif;
            color: var(--accent-color);
            background-color: #0a0a0a;
        }

        tr:hover {
            background-color: #1a1a1a;
        }

        .action-btn {
            padding: 5px 10px;
            font-size: 0.8em;
            margin-right: 5px;
        }

        .low-stock {
            color: var(--alert-color);
            font-weight: bold;
            text-shadow: 0 0 5px rgba(255, 51, 51, 0.4);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Nocturna</h1>
    <h3>Inventário Obscuro - Roupas Femininas</h3>

    <div class="panel">
        <h2 id="form-title">Cadastrar Novo Produto</h2>
        <form id="product-form">
            <input type="hidden" id="produto-id">
            <div class="form-grid">
                <div class="form-group">
                    <label for="codigo">Código (SKU)</label>
                    <input type="text" id="codigo" required>
                </div>
                <div class="form-group">
                    <label for="nome">Nome da Peça</label>
                    <input type="text" id="nome" required>
                </div>
                <div class="form-group">
                    <label for="categoria">Categoria</label>
                    <select id="categoria" required>
                        <option value="">Selecione...</option>
                        <option value="Vestidos">Vestidos</option>
                        <option value="Corsets">Corsets</option>
                        <option value="Saias">Saias</option>
                        <option value="Blusas">Blusas</option>
                        <option value="Acessórios">Acessórios</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="marca">Marca</label>
                    <input type="text" id="marca">
                </div>
                <div class="form-group">
                    <label for="modelo">Modelo</label>
                    <input type="text" id="modelo">
                </div>
                <div class="form-group">
                    <label for="quantidade">Qtd. em Estoque</label>
                    <input type="number" id="quantidade" required min="0">
                </div>
                <div class="form-group">
                    <label for="preco_custo">Preço de Custo (R$)</label>
                    <input type="number" id="preco_custo" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="preco_venda">Preço de Venda (R$)</label>
                    <input type="number" id="preco_venda" step="0.01" required>
                </div>
            </div>
            <div class="btn-group">
                <button type="button" onclick="limparFormulario()">Limpar / Cancelar</button>
                <button type="submit" id="btn-salvar">Salvar no Purgatório</button>
            </div>
        </form>
    </div>

    <div class="panel">
        <h2>Acervo do Estoque</h2>
        <div class="controls">
            <input type="text" id="busca" placeholder="Buscar por código ou nome..." onkeyup="filtrarTabela()">
            <select id="filtro-categoria" onchange="filtrarTabela()">
                <option value="">Todas as Categorias</option>
                <option value="Vestidos">Vestidos</option>
                <option value="Corsets">Corsets</option>
                <option value="Saias">Saias</option>
                <option value="Blusas">Blusas</option>
                <option value="Acessórios">Acessórios</option>
            </select>
        </div>
        
        <div style="overflow-x: auto;">
            <table id="tabela-produtos">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Nome</th>
                        <th>Categoria</th>
                        <th>Marca/Modelo</th>
                        <th>Estoque</th>
                        <th>Custo</th>
                        <th>Venda</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-corpo">
                    <!-- Conteúdo gerado via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // =========================================================================
    // CONFIGURAÇÃO DO SUPABASE - INSERIR SUAS CHAVES AQUI
    // =========================================================================
    const SUPABASE_URL = 'https://olgtqhaydslpvkfhtoip.supabase.co'; 
    const SUPABASE_ANON_KEY = 'sb_publishable_k3xHB1IL0M0TRwYN5abNfg_brbr5-wo';
    // =========================================================================

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let produtos = [];

    // Carregar produtos ao iniciar
    async function carregarProdutos() {
        const { data, error } = await db
            .from('produtos')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            alert('Erro ao invocar os registros: ' + error.message);
            return;
        }
        produtos = data;
        renderizarTabela(produtos);
    }

    // Renderizar tabela HTML
    function renderizarTabela(lista) {
        const tbody = document.getElementById('tabela-corpo');
        tbody.innerHTML = '';

        lista.forEach(prod => {
            const tr = document.createElement('tr');
            
            // Alerta de estoque baixo (menor que 3)
            const estoqueClass = prod.quantidade < 3 ? 'low-stock' : '';
            const estoqueTexto = prod.quantidade < 3 ? `${prod.quantidade} ⚠️` : prod.quantidade;

            tr.innerHTML = `
                <td>${prod.codigo}</td>
                <td>${prod.nome}</td>
                <td>${prod.categoria}</td>
                <td>${prod.marca || '-'} / ${prod.modelo || '-'}</td>
                <td class="${estoqueClass}">${estoqueTexto}</td>
                <td>R$ ${prod.preco_custo.toFixed(2)}</td>
                <td>R$ ${prod.preco_venda.toFixed(2)}</td>
                <td>
                    <button class="action-btn" onclick="editarProduto('${prod.id}')">Editar</button>
                    <button class="action-btn" onclick="excluirProduto('${prod.id}')">Excluir</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Filtro e Busca Local
    function filtrarTabela() {
        const termo = document.getElementById('busca').value.toLowerCase();
        const categoriaFiltro = document.getElementById('filtro-categoria').value;

        const filtrados = produtos.filter(prod => {
            const matchTexto = prod.nome.toLowerCase().includes(termo) || prod.codigo.toLowerCase().includes(termo);
            const matchCategoria = categoriaFiltro === "" || prod.categoria === categoriaFiltro;
            return matchTexto && matchCategoria;
        });

        renderizarTabela(filtrados);
    }

    // Salvar ou Atualizar
    document.getElementById('product-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const id = document.getElementById('produto-id').value;
        const payload = {
            codigo: document.getElementById('codigo').value,
            nome: document.getElementById('nome').value,
            categoria: document.getElementById('categoria').value,
            marca: document.getElementById('marca').value,
            modelo: document.getElementById('modelo').value,
            quantidade: parseInt(document.getElementById('quantidade').value),
            preco_custo: parseFloat(document.getElementById('preco_custo').value),
            preco_venda: parseFloat(document.getElementById('preco_venda').value)
        };

        if (id) {
            // Atualizar
            const { error } = await db.from('produtos').update(payload).eq('id', id);
            if (error) alert('Erro ao atualizar: ' + error.message);
            else alert('Registro alterado nas sombras com sucesso.');
        } else {
            // Inserir
            const { error } = await db.from('produtos').insert([payload]);
            if (error) alert('Erro ao selar o pacto (inserir): ' + error.message);
            else alert('Peça adicionada ao acervo.');
        }

        limparFormulario();
        carregarProdutos();
    });

    // Preparar formulário para edição
    function editarProduto(id) {
        const prod = produtos.find(p => p.id === id);
        if (!prod) return;

        document.getElementById('produto-id').value = prod.id;
        document.getElementById('codigo').value = prod.codigo;
        document.getElementById('nome').value = prod.nome;
        document.getElementById('categoria').value = prod.categoria;
        document.getElementById('marca').value = prod.marca;
        document.getElementById('modelo').value = prod.modelo;
        document.getElementById('quantidade').value = prod.quantidade;
        document.getElementById('preco_custo').value = prod.preco_custo;
        document.getElementById('preco_venda').value = prod.preco_venda;

        document.getElementById('form-title').innerText = 'Modificar Produto Existente';
        window.scrollTo(0, 0);
    }

    // Excluir
    async function excluirProduto(id) {
        if (confirm('Tem certeza que deseja banir esta peça do inventário para sempre?')) {
            const { error } = await db.from('produtos').delete().eq('id', id);
            if (error) alert('Erro ao banir: ' + error.message);
            else carregarProdutos();
        }
    }

    // Limpar Form
    function limparFormulario() {
        document.getElementById('product-form').reset();
        document.getElementById('produto-id').value = '';
        document.getElementById('form-title').innerText = 'Cadastrar Novo Produto';
    }

    // Iniciar aplicação
    carregarProdutos();
</script>
</body>
</html>
